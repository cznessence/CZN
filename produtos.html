<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos | CZN ESSENCE</title>

    <link rel="stylesheet" href="CSS.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- CABEÇALHO PADRÃO -->
    <header>
        <div class="marca">
            CZN
            <span>ESSENCE</span>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="produtos.html" class="ativo">Produtos</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <!-- TÍTULO DA PÁGINA -->
        <section class="titulo">
            <div class="linha"></div>

            <h1>NOSSOS PRODUTOS</h1>

            <p class="subtitulo">
                Escolha a essência que combina com você.
            </p>
        </section>

        <!-- PESQUISA E FILTROS -->
        <section class="filtros">

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar perfume ou marca..."
                aria-label="Pesquisar perfume ou marca">

            <div class="opcoes">

                <select id="genero" aria-label="Filtrar por gênero">
                    <option value="todos">Todos os gêneros</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="unissex">Unissex</option>
                </select>

                <select id="marca" aria-label="Filtrar por marca">
                    <option value="todas">Todas as marcas</option>
                </select>

                <button id="limparFiltros" type="button">
                    LIMPAR FILTROS
                </button>

            </div>

        </section>

        <!-- CONTADOR DE PRODUTOS -->
        <p id="contadorProdutos" class="contador-produtos"></p>

        <!-- OS PERFUMES SERÃO CARREGADOS PELO JAVASCRIPT -->
        <section
            id="listaProdutos"
            class="produtos"
            aria-label="Lista de perfumes">
        </section>

        <p id="nenhumProduto" style="display: none;">
            Nenhum produto encontrado.
        </p>

    </main>

    <!-- RODAPÉ PADRÃO -->
    <footer>
        © 2026 CZN ESSENCE — Essência que marca. Presença que fica.
    </footer>

    <!-- WHATSAPP -->
    <a
        href="https://wa.me/551999710375"
        class="whatsapp"
        target="_blank"
        rel="noopener"
        aria-label="Falar com a CZN ESSENCE pelo WhatsApp">

        <i class="fa-brands fa-whatsapp"></i>

    </a>

    <!-- SCRIPTS -->
    <script src="catalogo.js"></script>
    <script src="script.js"></script>

</body>
</html>
